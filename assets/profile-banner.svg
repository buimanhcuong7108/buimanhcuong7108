  <path d="M72 263 H1128" stroke="#A9B1D6" stroke-opacity="0.2"/>
  <circle cx="72" cy="263" r="3" fill="#7AA2F7"/>
  <circle cx="1128" cy="263" r="3" fill="#2AC3DE"/>
