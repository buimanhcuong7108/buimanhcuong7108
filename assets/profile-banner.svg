    <text x="36" y="101" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="3.4" fill="#A9B1D6">COMPUTER SCIENCE · UIT</text>
    <text x="36" y="136" font-family="JetBrains Mono, Consolas, monospace" font-size="15" letter-spacing="1.2" fill="#7AA2F7">LEARN  /  BUILD  /  ITERATE</text>
